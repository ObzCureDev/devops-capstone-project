#
# CD pipeline for the accounts microservice.
#
# It clones the repository, lints the code, runs the unit tests, builds the
# container image, pushes it to the registry, and deploys it to Kubernetes
# using the manifests kept in deploy/.
#
# The tasks it needs are defined in tekton/tasks.yaml
#   - cleanup, git-clone, flake8, nose, buildah, deploy-image
#
---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: cd-pipeline
spec:
  workspaces:
    - name: pipeline-workspace
  params:
    - name: repo-url
    - name: branch
      default: main
    - name: build-image
      description: The image to build, push and deploy
    - name: database-host
      description: The host name of the database used by the tests
      default: postgresql
  tasks:
    - name: init
      workspaces:
        - name: source
          workspace: pipeline-workspace
      taskRef:
        name: cleanup

    - name: clone
      workspaces:
        - name: output
          workspace: pipeline-workspace
      taskRef:
        name: git-clone
      params:
        - name: url
          value: $(params.repo-url)
        - name: revision
          value: $(params.branch)
      runAfter:
        - init

    - name: lint
      workspaces:
        - name: source
          workspace: pipeline-workspace
      taskRef:
        name: flake8
      params:
        - name: path
          value: service
      runAfter:
        - clone

    - name: tests
      workspaces:
        - name: source
          workspace: pipeline-workspace
      taskRef:
        name: nose
      params:
        - name: database-host
          value: $(params.database-host)
      runAfter:
        - clone

    - name: build
      workspaces:
        - name: source
          workspace: pipeline-workspace
      taskRef:
        name: buildah
      params:
        - name: IMAGE
          value: $(params.build-image)
        - name: TLSVERIFY
          value: "false"
      runAfter:
        - lint
        - tests

    - name: deploy
      workspaces:
        - name: source
          workspace: pipeline-workspace
      taskRef:
        name: deploy-image
      params:
        - name: image
          value: $(params.build-image)
      runAfter:
        - build
